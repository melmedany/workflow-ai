services:
  workflow-ai-database:
    image: postgres:16
    container_name: workflow-ai-database
    platform: linux/arm64 # For Apple Silicon (M-series) Macs
#   platform: linux/amd64 # For Intel Macs, Linux x86, or Windows
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: workflow-ai
      POSTGRES_PASSWORD: workflow-ai
      POSTGRES_DB: workflow-ai
    volumes:
      - workflow-ai-database:/var/lib/postgresql/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  workflow-ai-database: